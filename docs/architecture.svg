<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Astro 정적 웹사이트 아키텍처</title>
  <desc id="description">Astro 애플리케이션을 정적 자산으로 빌드해 GitHub Pages에 배포하고, 브라우저에서 사용자 인터랙션을 실행하는 흐름</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b" />
    </marker>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc" />
      <stop offset="1" stop-color="#eef2ff" />
    </linearGradient>
  </defs>

  <rect width="1200" height="560" rx="24" fill="url(#background)" />
  <rect x="1" y="1" width="1198" height="558" rx="23" fill="none" stroke="#dbe4f0" stroke-width="2" />

  <text x="48" y="54" fill="#0f172a" font-family="Inter, Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700">
    정적 웹사이트 아키텍처
  </text>
  <text x="48" y="80" fill="#64748b" font-family="Inter, Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">
    Build → Deploy → Run
  </text>

  <rect x="48" y="104" width="92" height="26" rx="13" fill="#ede9fe" />
  <text x="94" y="122" text-anchor="middle" fill="#6d28d9" font-family="Inter, Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">
    BUILD TIME
  </text>

  <g filter="url(#shadow)">
    <rect x="48" y="146" width="228" height="122" rx="16" fill="#ffffff" />
    <rect x="324" y="146" width="228" height="122" rx="16" fill="#ffffff" />
    <rect x="600" y="146" width="228" height="122" rx="16" fill="#ffffff" />
    <rect x="876" y="146" width="228" height="122" rx="16" fill="#ffffff" />
  </g>

  <g font-family="Inter, Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="66" y="164" width="36" height="36" rx="10" fill="#f3e8ff" />
    <text x="84" y="188" text-anchor="middle" fill="#9333ea" font-size="14" font-weight="800">&lt;/&gt;</text>
    <text x="66" y="224" fill="#0f172a" font-size="16" font-weight="700">Astro 애플리케이션</text>
    <text x="66" y="248" fill="#64748b" font-size="13">Pages · Layouts · Components</text>

    <rect x="342" y="164" width="36" height="36" rx="10" fill="#e0f2fe" />
    <circle cx="360" cy="182" r="9" fill="none" stroke="#0284c7" stroke-width="2" />
    <path d="M360 169V173M360 191V195M347 182H351M369 182H373" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
    <text x="342" y="224" fill="#0f172a" font-size="16" font-weight="700">정적 빌드</text>
    <text x="342" y="248" fill="#64748b" font-size="13">Astro · Tailwind CSS · TypeScript</text>

    <rect x="618" y="164" width="36" height="36" rx="10" fill="#dcfce7" />
    <path d="M628 173H644V191H628Z" fill="none" stroke="#16a34a" stroke-width="2" />
    <path d="M632 178H640M632 183H640M632 188H638" stroke="#16a34a" stroke-width="2" stroke-linecap="round" />
    <text x="618" y="224" fill="#0f172a" font-size="16" font-weight="700">정적 자산</text>
    <text x="618" y="248" fill="#64748b" font-size="13">HTML · CSS · JavaScript</text>

    <rect x="894" y="164" width="36" height="36" rx="10" fill="#e2e8f0" />
    <path d="M903 188C898 187 898 180 903 179C904 172 914 171 917 177C924 176 927 185 921 188Z" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" />
    <text x="894" y="224" fill="#0f172a" font-size="16" font-weight="700">GitHub Pages</text>
    <text x="894" y="248" fill="#64748b" font-size="13">정적 호스팅</text>
