  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M284 207H312" />
    <path d="M560 207H588" />
    <path d="M836 207H864" />
  </g>

  <line x1="48" y1="306" x2="1152" y2="306" stroke="#dbe4f0" stroke-width="2" />

  <rect x="48" y="328" width="76" height="26" rx="13" fill="#dbeafe" />
  <text x="86" y="346" text-anchor="middle" fill="#1d4ed8" font-family="Inter, Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">
