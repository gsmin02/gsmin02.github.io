  </text>

  <g filter="url(#shadow)">
    <rect x="48" y="370" width="228" height="116" rx="16" fill="#ffffff" />
    <rect x="324" y="370" width="228" height="116" rx="16" fill="#ffffff" />
    <rect x="600" y="370" width="228" height="116" rx="16" fill="#ffffff" />
    <rect x="876" y="370" width="228" height="116" rx="16" fill="#ffffff" />
  </g>

  <g font-family="Inter, Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="66" y="388" width="36" height="36" rx="10" fill="#e0f2fe" />
    <rect x="73" y="396" width="22" height="17" rx="2" fill="none" stroke="#0284c7" stroke-width="2" />
    <path d="M73 401H95" stroke="#0284c7" stroke-width="2" />
    <circle cx="77" cy="398.5" r="1" fill="#0284c7" />
    <text x="66" y="448" fill="#0f172a" font-size="16" font-weight="700">브라우저 요청</text>
    <text x="66" y="470" fill="#64748b" font-size="13">페이지 접근</text>

    <rect x="342" y="388" width="36" height="36" rx="10" fill="#e2e8f0" />
    <path d="M351 412C346 411 346 404 351 403C352 396 362 395 365 401C372 400 375 409 369 412Z" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" />
    <text x="342" y="448" fill="#0f172a" font-size="16" font-weight="700">GitHub Pages</text>
    <text x="342" y="470" fill="#64748b" font-size="13">정적 자산 전달</text>

    <rect x="618" y="388" width="36" height="36" rx="10" fill="#dcfce7" />
    <path d="M627 397H645V414H627Z" fill="none" stroke="#16a34a" stroke-width="2" />
    <path d="M630 401L633 404L630 407M642 401L639 404L642 407" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="618" y="448" fill="#0f172a" font-size="16" font-weight="700">정적 UI 실행</text>
    <text x="618" y="470" fill="#64748b" font-size="13">HTML · CSS · JavaScript</text>

    <rect x="894" y="388" width="36" height="36" rx="10" fill="#f3e8ff" />
    <path d="M912 397V415M903 406H921" stroke="#9333ea" stroke-width="2" stroke-linecap="round" />
    <circle cx="912" cy="406" r="8" fill="none" stroke="#9333ea" stroke-width="2" />
    <text x="894" y="448" fill="#0f172a" font-size="16" font-weight="700">사용자 인터랙션</text>
    <text x="894" y="470" fill="#64748b" font-size="13">탐색 · 테마 · 퀴즈 UI</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M284 428H312" />
    <path d="M560 428H588" />
    <path d="M836 428H864" />
  </g>

  <text x="600" y="528" text-anchor="middle" fill="#64748b" font-family="Inter, Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">
    서버 런타임 없이 정적 자산과 UI 상호작용을 브라우저에서 실행합니다.
  </text>
</svg>
